# lolita-agents —— 2C2G 低配档 nginx server 配置
#
# 安装位置：/etc/nginx/sites-available/lolita.conf
# 启用：sudo ln -s /etc/nginx/sites-available/lolita.conf /etc/nginx/sites-enabled/
# 限流 zone 依赖 /etc/nginx/conf.d/lolita-limits.conf（见 deploy/nginx/limits.conf）。
#
# 需要替换的占位符：__DOMAIN__（演示域名，如 demo.example.com）
#
# nginx 版本说明：
#   - Ubuntu 24.04 自带 1.24，支持下面 `listen 443 ssl http2` 的写法；
#   - nginx >= 1.25.1 已废弃该写法，改成 `listen 443 ssl;` 并另起一行 `http2 on;`。
#
# 证书首次签发前不要启用 443 段（见 docs/deploy.md 3.12）：先只放 80 段签证书。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 80：只负责 ACME 校验与跳转 443
server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # 面试演示口令（建议开启）：浏览器会自动附带，页面与 SSE 都能用。
    # 生成方式见 deploy/README.md；密码只在终端输入，不写进仓库。
    auth_basic "lolita demo";
    auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 8m;

    # 对话接口单独限流：同一 IP 同时 1 个连接、每分钟最多 6 次。
    # 正则 location 只匹配这两个精确路径，静态资源与 /api/health 不受影响，
    # 所以不会出现「首屏加载被自己挡成 503」。
    location ~ ^/api/chat(/stream)?$ {
        limit_conn chat_conn 1;
        limit_req  zone=chat_req burst=1 nodelay;
        # 默认就是 503，这里显式写死，避免以后改全局默认值把语义改掉。
        limit_conn_status 503;
        limit_req_status  503;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE 逐字返回的关键：不缓冲、不压缩。
        # 读超时 = 单次预算 + 30s 余量：90s 对应 AGENT_DEADLINE=60；
        # 若按 deploy/env/2c2g.env.example 调到 45，同步改成 75s。
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # 其余路径（首页、静态资源、健康检查、索引状态）不限流
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
