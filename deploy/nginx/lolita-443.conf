# lolita-agents —— 80 + 443 完整版（域名审核通过后直接替换）
#
# 安装位置：/etc/nginx/sites-available/lolita.conf
# 启用：sudo ln -s /etc/nginx/sites-available/lolita.conf /etc/nginx/sites-enabled/
# 限流 zone 依赖 /etc/nginx/conf.d/lolita-limits.conf（deploy/nginx/limits.conf）。
#
# 需要替换的占位符：__DOMAIN__（示例 demo.example.com），其余不用改。
#
# 上线顺序（详见 docs/deploy.md 3.12）：
#   1) 域名 A 记录指向服务器，80 端口先放行；
#   2) 临时只启用本文件的 80 段（或先用 80 端口版配置）跑
#      sudo certbot certonly --webroot -w /var/www/certbot -d __DOMAIN__；
#   3) 证书落地 /etc/letsencrypt/live/__DOMAIN__/ 后再整份启用；
#   4) sudo nginx -t && sudo systemctl reload nginx。
#   证书续期由 certbot 的 systemd timer 负责，reload 钩子会自动生效。
#
# 与 80 端口版的差异只有：强制跳转 HTTPS、挂证书、可选访问口令。
# 对话限流与 SSE 不缓冲的参数保持一致（读超时 75s 对应 AGENT_DEADLINE=45）。
#
# nginx 版本说明：Ubuntu 24.04 自带 1.24，支持 `listen 443 ssl http2`；
# nginx >= 1.25.1 请改成 `listen 443 ssl;` 加另起一行 `http2 on;`。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 80：只负责 ACME 校验与跳转 HTTPS
server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    # 演示期不急着开 HSTS：一旦浏览器记住，证书出问题会让人连不回来。
    # 稳定后想开再去掉下一行注释。
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # 面试演示口令（可选）。启用前必须先建文件，否则 nginx -t 会报错：
    #   sudo apt-get install -y apache2-utils
    #   sudo htpasswd -c /etc/nginx/.htpasswd demo    # 密码只在终端输入
    # 同时记得给 SSE 之外的静态资源也带上——浏览器会自动附带同一 realm 的凭据。
    # auth_basic "lolita demo";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 8m;

    # 对话接口单独限流：同一 IP 同时 1 个连接、每分钟最多 6 次。
    # 正则只匹配这两个精确路径，静态资源与 /api/health 不受影响，
    # 因此不会出现「首屏并行请求被自己挡成 503」。
    location ~ ^/api/chat(/stream)?$ {
        limit_conn chat_conn 1;
        limit_req  zone=chat_req burst=1 nodelay;
        limit_conn_status 503;
        limit_req_status  503;

        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE 逐字返回的关键：不缓冲、不压缩。
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    # 其余路径（首页、静态资源、健康检查、索引状态）不限流
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
