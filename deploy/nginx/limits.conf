# lolita-agents —— 限流 zone 定义（2C2G 低配档）
#
# 安装位置：/etc/nginx/conf.d/lolita-limits.conf
# 必须放在 http 上下文；Ubuntu 的 nginx.conf 默认 include /etc/nginx/conf.d/*.conf，
# 所以直接丢进 conf.d 即可。放进 server 块会报 "limit_conn_zone directive is not allowed here"。
#
# 这些 zone 只被 deploy/nginx/lolita.conf 里的 /api/chat 与 /api/auth 正则
# location 使用，静态资源、/api/health、/api/kb/status 都不受影响。
#
# 10m 约可存 16 万条 IP 状态，个人演示远远够用。

# 同一 IP 同时只允许 1 个对话连接（第二条直接 503，属于预期保护）。
limit_conn_zone $binary_remote_addr zone=chat_conn:10m;

# 同一 IP 每分钟最多发起 6 次对话；burst=1 允许短暂连发 1 条排队，nodelay 让它立即执行。
# 6r/m 是防止误触 F5 或脚本刷接口，不是性能指标。
#
# 加了账号后：同一 NAT 后的多个账号会共享这个 IP 配额（新建/切换/删除对话走
# /api/threads，不受这里限制；只有真正提问受限）。2C2G 上单机 agent 一次只扛
# 得住一条生成，保持 1 并发是保护内存；若演示时多人共用一个出口 IP，把
# limit_conn 调到 2、rate 调到 12r/m，并接受内存占用翻倍的代价。
limit_req_zone $binary_remote_addr zone=chat_req:10m rate=6r/m;

# 登录/注册：防止脚本撞库与批量注册。正常用户每分钟远低于 5 次。
limit_req_zone $binary_remote_addr zone=auth_req:10m rate=5r/m;
