name: CI

# 对 PR 和 main 的直推都触发：本仓库默认直接提交 main，没有 PR 就没有远端门禁。
# 两处触发的是同一套 job；如果同一改动既开 PR 又落 main，会各跑一遍（ref 不同，
# concurrency 不会互相取消），这是可接受的重复。
# 托管 runner 上能跑的三项：ruff、pytest、离线检索门禁（quick-offline）。
# 检索门禁只跑 quick 里 4 条 own 条目：上游代码可以公开 clone，own 索引可以由
# content/kb 现场重建；real / lolibrary 依赖两份不进 git 的索引，跑不了，所以
# 不进这一步（它们仍由手动工作流 eval-gate.yml 或有数据的机器覆盖）。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: 安装依赖
        run: python -m pip install -r requirements-dev.txt

      - name: Lint（ruff）
        run: python -m ruff check .

      - name: 单元测试（pytest）
        run: python -m pytest

  offline-eval-gate:
    runs-on: ubuntu-latest
    env:
      LOLITA_RAG_ROOT: ${{ github.workspace }}/lolita-rag
      # 托管 runner 不下载 BGE：embedding 降级为 hash，索引与检索全程离线且确定。
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: 检出上游知识管线
        uses: actions/checkout@v4
        with:
          repository: passer423/lolita-rag
          path: lolita-rag

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: 安装依赖（不含 BGE，避免下载 torch 与模型）
        run: |
          python -m pip install -r requirements-dev.txt
          grep -v -E '^sentence-transformers' lolita-rag/requirements.txt > /tmp/upstream-requirements.txt
          python -m pip install -r /tmp/upstream-requirements.txt

      - name: 建立自有知识库索引（离线，hash 兜底）
        run: python scripts/build_kb_index.py

      # 阈值沿用 quick 口径（0.66 / 0.75，见 eval-gate.yml 注释）；不加
      # continue-on-error：低于阈值时 eval.run 退出码为 1，这一步就红。
      - name: 快速评测（离线核心通道门禁）
        run: >-
          python -m eval.run --subset quick-offline --configs baseline
          --min-recall1 0.66 --min-cite1 0.75
