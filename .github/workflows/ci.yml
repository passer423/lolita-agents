name: CI

# 只对 PR 触发：本仓库约定不直接推 main，合入前的门禁就是这里。
# 只跑托管 runner 上真能跑的两项（ruff + pytest），绿就是真绿。
# 检索质量回归需要上游仓库与两份索引，不挂 PR：走手动工作流 eval-gate.yml，
# 或在有数据的机器上按 AGENTS.md 本地执行。
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: 安装依赖
        run: python -m pip install -r requirements-dev.txt

      - name: Lint（ruff）
        run: python -m ruff check .

      - name: 单元测试（pytest）
        run: python -m pytest
